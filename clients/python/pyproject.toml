[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "situcraft"
version = "0.8.0"
description = "Remote control of a running SituCraft (imaging spatial transcriptomics) from Python"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Robert McDermott" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["spatial transcriptomics", "Xenium", "segmentation", "cell types", "SituCraft"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
pandas = ["pandas"]

[project.urls]
Homepage = "https://github.com/robert-mcdermott/situcraft"
Documentation = "https://github.com/robert-mcdermott/situcraft/tree/main/clients"

[tool.setuptools.packages.find]
where = ["src"]
