name: Real data

# Weekly and by hand: SituCraft's readers on both development bundles (the Breast bundle's
# 368 MB too, which each commit's CI leaves out), against independent readers. Each commit is
# checked on the smaller Lung bundle by ci.yml; this run catches what only the larger bundle has
# (four channels, multimodal segmentation) without making every commit download it.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundles:
    name: Both development bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the bundles (10x Genomics, CC BY 4.0)
        uses: actions/cache@v4
        with:
          path: validation/cache
          key: xenium-bundles-${{ hashFiles('validation/sources.json') }}
      - name: Fetch them
        run: node validation/fetch.mjs
      - name: OpenJPEG, the independent decoder the image tiles are compared with
        run: sudo apt-get update -q && sudo apt-get install -y -q libopenjp2-tools
      - uses: astral-sh/setup-uv@v6
      - name: The Lung bundle as SpatialData, written by spatialdata-io (for the import test)
        run: uv run --with 'spatialdata-io==0.7.1' --with 'spatialdata==0.8.0' python -I validation/spatialdata.py
      - name: Readers against independent readers, bundle validation (real, zipped and broken bundles), the derived-data cache, segmentations made and imported, the refinement's estimates against measured runs, and exports (kept for the next step)
        env:
          SITUCRAFT_REQUIRE_DATA: '1'
          SITUCRAFT_REQUIRE_SPATIALDATA: '1'
          # Outside the cached folder: the exports are rewritten each run.
          SITUCRAFT_EXPORT_DIR: ${{ runner.temp }}/exports
          JP2K_ZSTACK_ALL: '1'
        run: go test -v -run 'Real|Readers|Bundle|Estimates' . ./validation/ ./internal/jp2k/ ./internal/xenium/ ./internal/cache/ ./internal/view/ ./internal/segment/... ./internal/compare/ ./internal/export/
      - name: The exports read by spatialdata, anndata, pandas, scipy, geopandas and numpy, as the committed check recorded
        env:
          SITUCRAFT_EXPORT_DIR: ${{ runner.temp }}/exports
        run: uv run --with 'spatialdata==0.8.0' --with 'anndata==0.13.4' --with 'pyarrow==26.0.0' --with 'geopandas==1.2.0' --with 'scipy==1.18.1' python -I validation/reference/read_exports.py --check
      - name: Simulated bundles read by spatialdata-io, tifffile and pyarrow as the simulation made them
        run: |
          go run . simulate --preset small --quiet "$RUNNER_TEMP/simulated-small"
          go run . simulate --quiet "$RUNNER_TEMP/simulated-standard"
          for b in simulated-small simulated-standard; do
            uv run --with 'spatialdata-io==0.7.1' --with 'spatialdata==0.8.0' --with 'tifffile==2026.9.20' python -I validation/reference/read_simulation.py "$RUNNER_TEMP/$b"
          done
      - name: The tissue viewer in headless Chrome against its data (exact samples, points, frame rate)
        env:
          SITUCRAFT_REQUIRE_DATA: '1'
          # A runner has no GPU: Chrome's software WebGL, and no sandbox on the throwaway machine.
          SITUCRAFT_CHROME_ARGS: --use-angle=swiftshader --enable-unsafe-swiftshader --no-sandbox
        run: node validation/run.mjs viewer --require-data
